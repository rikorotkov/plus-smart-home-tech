spring:
  kafka:
    bootstrap-servers: "localhost:9092"
    producer:
      key-serializer: "org.apache.kafka.common.serialization.StringSerializer"
      value-serializer: "ru.yandex.practicum.serializer.GeneralAvroSerializer"
    consumer:
      group-id: "telemetry-group"
      key-deserializer: "org.apache.kafka.common.serialization.StringDeserializer"
      value-deserializer: "ru.yandex.practicum.serializer.GeneralAvroDeserializer"

topic:
  hub-event: "telemetry.hubs.v1"
  sensor-event: "telemetry.sensors.v1"

grpc:
  server:
    port: 59091